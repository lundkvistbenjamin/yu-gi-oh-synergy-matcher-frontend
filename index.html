<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Duelist Synergy</title>
    </head>

    <body>
        <div class="main-panel">
            <h1>DUELIST SYNERGY</h1>

            <div class="description">
                Input your card's parameters below. The algorithm will analyze these statistics against the database to
                predict the most compatible archetype.
            </div>

            <form id="synergyForm">
                <select id="type" required>
                    <option value="">Select Type</option>
                </select>
                <select id="race" required>
                    <option value="">Select Race</option>
                </select>
                <input type="number" id="atk" placeholder="ATK" required>
                <input type="number" id="def" placeholder="DEF" required>
                <input type="number" id="level" placeholder="Level" required>
                <select id="attribute" required>
                    <option value="">Select Attribute</option>
                </select>
                <button type="submit">Run Analysis</button>
            </form>
            <div id="result"></div>
        </div>

        <script src="app.js"></script>
    </body>

</html>
