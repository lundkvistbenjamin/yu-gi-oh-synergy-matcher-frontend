<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Duelist Synergy</title>
    </head>

    <body>
        <div class="main-panel">
            <h1>DUELIST SYNERGY</h1>
            <div class="description">
                Input your monster card's parameters below. The algorithm will analyze these statistics against the
                database to
                predict the most compatible archetypes.
            </div>
            <form id="synergyForm">
                <select id="type" name="type" required>
                    <option value="">Select Type</option>
                </select>
                <select id="race" name="race" required>
                    <option value="">Select Race</option>
                </select>
                <select id="attribute" name="attribute" required>
                    <option value="">Select Attribute</option>
                </select>
                <input type="number" id="level" name="level" placeholder="Level" required>
                <input type="number" id="atk" name="atk" placeholder="ATK" required>
                <input type="number" id="def" name="def" placeholder="DEF" required>
                <button type="submit">Run Analysis</button>
            </form>
            <div id="result"></div>
        </div>
        <script src="app.js"></script>
    </body>

</html>
